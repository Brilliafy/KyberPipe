[package]
name = "desktop-app"
version = "0.1.0"
description = "KyberPipe Desktop Node (PQC & Flatpak Portal Engine)"
authors = ["Kyberpipe Team"]
edition = "2021"

[lib]
name = "desktop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
core-crypto = { path = "../../core-crypto" }
quinn = "0.11"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
rfd = { version = "0.14", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.0", features = ["full"] }
ashpd = "0.9"
boa_engine = "0.19"
wasmtime = "22.0"
arboard = "3.4"
notify-rust = "4.11"
keyring = "2.1"
hex = "0.4"
base64 = "0.22"
mimalloc = "0.1"
tracing = "0.1"
rand = { package = "rand", version = "0.8" }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
magic-wormhole = { version = "0.8", optional = true }
arti-client = { version = "0.44", optional = true }
tokio-util = "0.7"
directories = "5.0"
sha2 = "0.10"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }



[dev-dependencies]
wat = "1.254"
